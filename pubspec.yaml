name: magical_lms_teacher
description: Magical LMS Teacher mobile app using the Magical LMS backend.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.2.0
  google_sign_in: ^6.3.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  image_picker: ^1.0.7
  mobile_scanner: ^5.2.3
  intl: ^0.20.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  pdf: ^3.10.8
  flutter_image_compress: ^2.5.1
  video_compress: ^3.1.4
  audioplayers: ^6.7.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
